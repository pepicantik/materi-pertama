<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container">
        <div class="row my-5">
            <h1 class="text-center mt-5">Latihan 10 - Latihan Operator</h1>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-2">
                <div class="input-group">
                    <input class="form-control" placeholder="angka pertama" type="text" id="aritmatikaAngka1">
                </div>
            </div>
            <div class="col-2">
                <!-- dropdown -->
                 <div class="input-group">
                    <select id="operatorAritmatika" class="form-select">
                        <option selected>Pilih Operator</option>
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="/">/</option>
                        <option value="*">X</option>
                        <option value="%">%</option>
                    </select>
                 </div>
            </div>
            <div class="col-2">
                <div class="input-group">
                    <input type="number" class="form-control" id="aritmatikaAngka2" placeholder="angka kedua">
                </div>
            </div>
            <div class="col-3">
                    <button type="button" class="btn btn-primary" id="button_aritmatika">Hasil hitung</button>

                    <span class="mx-4" id="hasilOperasi">Hasil</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/latihan 10/script.js"></script>
</body>
</html>
